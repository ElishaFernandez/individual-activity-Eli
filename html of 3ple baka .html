<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3ple baka game project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        /* Main wrapper */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Left & Right sidebars */
        .left, .right {
            width: 20%;
            background: #ddd;
            padding: 10px;
        }

  /* Center (game area) */
.center {
    width: 60%;
    background: #fff;
    padding: 0;              /* WALANG padding */
    display: flex;
}

/* Portrait game screens */
.game-container,
.game-content {
    width: 50%;              /* eksaktong hati */
    aspect-ratio: 9 / 16;
    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;
    color: white;

    margin: 0;               /* WALANG margin */
}


        /* Mobile responsive */
        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
            }
            .left, .center, .right {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="layout">

        <!-- Left container -->
        <div class="left">
            <h3>Please Choose Your Character</h3>
            <p></p>
            <button id="start-game" onclick="button">button</button>
        </div>

        <!-- Center container -->
        <div class="center">
            <div class="game-container">
                Game goes here
            </div>
            <div class="game-content" style="background-color: pink;">another one</div>
        </div>

        <!-- Right container -->
        <div class="right">
            <h3>Please Choose Your Character</h3>
            <p></p>
            <button id="start-game" onclick="button">button</button>
        </div>

    </div>

</body>
</html>
